server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (React Router, added in 3.7+) resolve to
    # index.html instead of 404ing on a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundle; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
