services:
  db:
    image: pgvector/pgvector:pg16   # NOT postgres:16 — pgvector extension needed from Phase 1
    environment:
      POSTGRES_USER: modir
      POSTGRES_PASSWORD: modir
      POSTGRES_DB: modir
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - modir_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modir"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports exposed externally — db is internal only.

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - modir_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modir-access
      MINIO_ROOT_PASSWORD: modir-secret-changeme
    volumes:
      - minio_data:/data
    networks:
      - modir_net
    ports:
      - "9001:9001"  # console only; API stays internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev mail catcher (Phase 1.5). The mailer sends activation emails here over
  # SMTP (1025) in dev mode; view them at http://localhost:8025. No real mail
  # ever leaves the machine in development.
  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - modir_net
    ports:
      - "8025:8025"  # web UI; SMTP 1025 stays internal on the network

  vault:
    image: hashicorp/vault:latest
    # Real server mode (NOT -dev): file storage in the vault_data volume, so
    # secrets PERSIST across `docker compose up/down`. The official entrypoint
    # writes VAULT_LOCAL_CONFIG to /vault/config/local.json and runs
    # `vault server -config=/vault/config`.
    command: server
    environment:
      VAULT_LOCAL_CONFIG: >-
        {"storage": {"file": {"path": "/vault/file"}},
         "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
         "ui": true}
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    networks:
      - modir_net
    ports:
      - "8200:8200"  # exposed for the UI (http://localhost:8200) and host CLI
    healthcheck:
      # Exit 0 only when initialized AND unsealed (sealed exits 2), so
      # service_healthy below means "ready for KV reads", not just "process up".
      # start_period gives vault-init time to unseal before failures count.
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # One-shot bootstrap for the persistent Vault above. Runs on every `up` but
  # only does infra work — it NEVER touches stored secrets:
  #   first boot:  init (1 key share) -> save keys to secrets/vault-init.txt
  #                (gitignored) -> unseal -> enable KV v2 at secret/ -> create
  #                a root-alias token with id "root" so .env VAULT_TOKEN=root
  #                keeps working.
  #   later boots: just unseals using the saved key file.
  vault-init:
    image: hashicorp/vault:latest
    # Run as root: the entrypoint writes the unseal-key file into the bind-mounted
    # ./secrets, which Docker Desktop mounts root-owned — the default vault user
    # (uid 100) gets "Permission denied" creating vault-init.txt.
    user: "0:0"
    environment:
      VAULT_ADDR: http://vault:8200
      SKIP_SETCAP: "true"   # we override the entrypoint; skip the image's mlock setcap step
    cap_add:
      # The vault CLI binary carries an IPC_LOCK file capability; without this
      # cap the binary fails to exec ("Operation not permitted", rc 126), so the
      # wait loop below never sees a real status and times out. Matches vault-seed.
      - IPC_LOCK
    volumes:
      - ./secrets:/vault/secrets
    networks:
      - modir_net
    depends_on:
      vault:
        condition: service_started   # can't wait for healthy — healthy requires the unseal WE do
    restart: "no"
    # All $$ are deliberate: they expand IN THE CONTAINER at run time; a single $
    # would make compose interpolate from the HOST at parse time.
    entrypoint:
      - sh
      - -c
      - |
        KEYS_FILE=/vault/secrets/vault-init.txt
        i=0
        while :; do
          vault status >/dev/null 2>&1
          rc=$$?
          if [ "$$rc" = "0" ] || [ "$$rc" = "2" ]; then break; fi
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then echo "vault-init: Vault API never came up"; exit 1; fi
          sleep 1
        done
        if vault status 2>/dev/null | grep -q "Initialized.*false"; then
          echo "vault-init: first boot — initializing and unsealing"
          vault operator init -key-shares=1 -key-threshold=1 > "$$KEYS_FILE" || exit 1
          UNSEAL_KEY=$$(grep "Unseal Key 1:" "$$KEYS_FILE" | awk '{print $$NF}')
          ROOT_TOKEN=$$(grep "Initial Root Token:" "$$KEYS_FILE" | awk '{print $$NF}')
          vault operator unseal "$$UNSEAL_KEY" >/dev/null || exit 1
          export VAULT_TOKEN="$$ROOT_TOKEN"
          vault secrets enable -path=secret kv-v2 || exit 1
          vault token create -id=root -policy=root >/dev/null || exit 1
          echo "vault-init: done — keys saved to secrets/vault-init.txt (gitignored)"
          echo "vault-init: seed initial secrets ONCE with:"
          echo "vault-init:   docker compose --profile seed run --rm vault-seed"
        elif vault status 2>/dev/null | grep -q "Sealed.*true"; then
          UNSEAL_KEY=$$(grep "Unseal Key 1:" "$$KEYS_FILE" 2>/dev/null | awk '{print $$NF}')
          if [ -z "$$UNSEAL_KEY" ]; then
            echo "vault-init: Vault is sealed and $$KEYS_FILE is missing — unseal manually:"
            echo "vault-init:   docker compose exec vault vault operator unseal <key>"
            exit 1
          fi
          vault operator unseal "$$UNSEAL_KEY" >/dev/null || exit 1
          echo "vault-init: unsealed existing Vault"
        else
          echo "vault-init: already initialized and unsealed — nothing to do"
        fi

  # MANUAL seed — does NOT run on `docker compose up` (profile-gated). Vault now
  # persists, so run this exactly once after the first init (or deliberately, to
  # reset the paths below to the values in .vault_secrets.env / placeholders):
  #
  #   docker compose --profile seed run --rm vault-seed
  #
  # WARNING: re-running OVERWRITES these paths. Day-to-day changes should be made
  # by hand instead, in the UI (http://localhost:8200, token "root") or CLI:
  #   docker compose exec vault sh -c 'VAULT_TOKEN=root vault kv patch secret/modir/llm gemini_api_key=...'
  #
  # Real keys: create .vault_secrets.env (gitignored) with your actual values.
  # Place the GCP service-account JSON at secrets/service_account.json (gitignored).
  # Both files are optional — missing entries fall back to dev placeholders.
  vault-seed:
    image: hashicorp/vault:latest
    profiles: [seed]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      SKIP_SETCAP: "true"   # we override the entrypoint; skip the image's mlock setcap step
    env_file:
      - path: .vault_secrets.env
        required: false
    cap_add:
      - IPC_LOCK
    volumes:
      - ./secrets:/vault/secrets:ro
    networks:
      - modir_net
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    # All $$ are deliberate: the variables expand IN THE CONTAINER at run time,
    # fed by env_file (.vault_secrets.env). A single $ would make compose
    # interpolate from the HOST at parse time — silently substituting the
    # placeholder defaults and CLOBBERING real secrets on every seed re-run.
    entrypoint:
      - sh
      - -c
      - |
        OCR_JSON="$$(cat /vault/secrets/service_account.json 2>/dev/null || echo '{}')"
        vault kv put secret/modir/llm \
          gemini_api_key="$${GEMINI_API_KEY:-placeholder-rotate-before-prod}" \
          langsmith_api_key="$${LANGSMITH_API_KEY:-dev-langsmith-key-rotate-before-prod}" \
          grok_api_key="$${GROK_API_KEY:-}" \
          anthropic_api_key="$${ANTHROPIC_API_KEY:-}" &&
        vault kv put secret/modir/minio \
          access_key="$${MINIO_ACCESS_KEY:-modir-access}" \
          secret_key="$${MINIO_SECRET_KEY:-modir-secret-changeme}" &&
        vault kv put secret/modir/auth \
          jwt_secret="$${JWT_SECRET:-dev-jwt-secret-rotate-before-prod}" &&
        vault kv put secret/modir/mail \
          api_key="$${MAIL_API_KEY:-dev-mail-key-rotate-before-prod}" &&
        vault kv put secret/modir/ocr \
          service_account_json="$$OCR_JSON" &&
        vault kv put secret/modir/whatsapp \
          api_token="$${WHATSAPP_API_TOKEN:-dev-whatsapp-token-placeholder}" \
          verify_token="$${WHATSAPP_VERIFY_TOKEN:-dev-verify-token-changeme}"

  migrate:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started
    # Runtime image has no `uv` (deps baked into .venv, on PATH) — call alembic directly.
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/var/log/modir
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy   # healthy = initialized AND unsealed
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Background OCR worker (Phase 5) — the project's first worker. SAME image as the
  # api, a different entrypoint: it polls for uploaded supplier bills and runs the
  # OCR pipeline OUT of the api container (OCR takes seconds; it must never block a
  # request). Same dependency chain as api (db/vault/seed/migrate ready first).
  worker:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    # Runtime image has deps baked into .venv (on PATH); call python directly.
    command: ["python", "-m", "app.worker"]
    volumes:
      - api_logs:/var/log/modir
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy   # healthy = initialized AND unsealed
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── Backup service (Phase 8, Task 8.8) ───────────────────────────────────
  # Run on demand: docker compose --profile backup run --rm backup
  # Restore:       docker compose --profile backup run --rm backup /app/scripts/restore.sh
  backup:
    build:
      context: ./backend
    image: modir-backend
    profiles: [backup]
    command: ["/bin/bash", "/app/scripts/backup.sh"]
    volumes:
      - "./backups:/app/backups"
    environment:
      - DATABASE_URL
      - MINIO_ENDPOINT
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_BUCKET
      - MINIO_SECURE
    networks:
      - modir_net
    depends_on:
      db:
        condition: service_healthy

  # ── Observability stack (Phase 8, Task 8.6) ──────────────────────────────
  # Start with: docker compose --profile observability up
  # Then set LOKI_URL=http://loki:3100 in .env so the API ships logs.
  loki:
    image: grafana/loki:2.9.0
    profiles: [observability]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - modir_net
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:10.2.0
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning"
      - "./infra/grafana/dashboards:/var/lib/grafana/dashboards"
      - grafana_data:/var/lib/grafana
    networks:
      - modir_net
    depends_on:
      - loki

volumes:
  db_data:
  redis_data:
  minio_data:
  vault_data:
  api_logs:
  loki_data:
  grafana_data:

networks:
  modir_net:
    driver: bridge
