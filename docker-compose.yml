services:
  db:
    image: pgvector/pgvector:pg16   # NOT postgres:16 — pgvector extension needed from Phase 1
    environment:
      POSTGRES_USER: modir
      POSTGRES_PASSWORD: modir
      POSTGRES_DB: modir
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - modir_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modir"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports exposed externally — db is internal only.

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - modir_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modir-access
      MINIO_ROOT_PASSWORD: modir-secret-changeme
    volumes:
      - minio_data:/data
    networks:
      - modir_net
    ports:
      - "9001:9001"  # console only; API stays internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev mail catcher (Phase 1.5). The mailer sends activation emails here over
  # SMTP (1025) in dev mode; view them at http://localhost:8025. No real mail
  # ever leaves the machine in development.
  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - modir_net
    ports:
      - "8025:8025"  # web UI; SMTP 1025 stays internal on the network

  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    networks:
      - modir_net
    ports:
      - "8200:8200"  # exposed so seed script can hit it from host
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev-only: Vault runs in in-memory dev mode, so secrets are wiped on every
  # recreate. This one-shot service re-seeds them automatically once Vault is up,
  # then exits. Keeps `docker compose up` self-contained — no manual seed step.
  #
  # Real keys: create .vault_secrets.env (gitignored) with your actual values.
  # Place the GCP service-account JSON at secrets/service_account.json (gitignored).
  # Both files are optional — missing entries fall back to dev placeholders.
  vault-seed:
    image: hashicorp/vault:latest
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      SKIP_SETCAP: "true"   # we override the entrypoint; skip the image's mlock setcap step
    env_file:
      - path: .vault_secrets.env
        required: false
    cap_add:
      - IPC_LOCK
    volumes:
      - ./secrets:/vault/secrets:ro
    networks:
      - modir_net
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        OCR_JSON="$$(cat /vault/secrets/service_account.json 2>/dev/null || echo '{}')"
        vault kv put secret/modir/llm \
          gemini_api_key="${GEMINI_API_KEY:-placeholder-rotate-before-prod}" \
          langsmith_api_key="${LANGSMITH_API_KEY:-dev-langsmith-key-rotate-before-prod}" \
          grok_api_key="${GROK_API_KEY:-}" \
          anthropic_api_key="${ANTHROPIC_API_KEY:-}" &&
        vault kv put secret/modir/minio \
          access_key="${MINIO_ACCESS_KEY:-modir-access}" \
          secret_key="${MINIO_SECRET_KEY:-modir-secret-changeme}" &&
        vault kv put secret/modir/auth \
          jwt_secret="${JWT_SECRET:-dev-jwt-secret-rotate-before-prod}" &&
        vault kv put secret/modir/mail \
          api_key="${MAIL_API_KEY:-dev-mail-key-rotate-before-prod}" &&
        vault kv put secret/modir/ocr \
          service_account_json="$$OCR_JSON"

  migrate:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started
    # Runtime image has no `uv` (deps baked into .venv, on PATH) — call alembic directly.
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/var/log/modir
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      vault-seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Background OCR worker (Phase 5) — the project's first worker. SAME image as the
  # api, a different entrypoint: it polls for uploaded supplier bills and runs the
  # OCR pipeline OUT of the api container (OCR takes seconds; it must never block a
  # request). Same dependency chain as api (db/vault/seed/migrate ready first).
  worker:
    build:
      context: ./backend
    env_file: .env
    networks:
      - modir_net
    # Runtime image has deps baked into .venv (on PATH); call python directly.
    command: ["python", "-m", "app.worker"]
    volumes:
      - api_logs:/var/log/modir
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      vault-seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  redis_data:
  minio_data:
  vault_data:
  api_logs:

networks:
  modir_net:
    driver: bridge
