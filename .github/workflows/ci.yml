name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # Real Postgres with pgvector so PG-specific types/constraints (and future
      # vector search) behave like prod — tests never run against sqlite.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: modir
          POSTGRES_PASSWORD: modir
          POSTGRES_DB: modir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modir"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The app's Settings require these. DB points at the service container;
      # the rest are throwaway test values (no Vault in CI — see import test).
      DATABASE_URL: postgresql+asyncpg://modir:modir@localhost:5432/modir
      REDIS_URL: redis://localhost:6379/0
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: test
      # Tests connect here directly (conftest reads TEST_DATABASE_URL).
      TEST_DATABASE_URL: postgresql+asyncpg://modir:modir@localhost:5432/modir

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Lint with ruff
        working-directory: ./backend
        run: uv run ruff check .

      - name: Format check with black
        working-directory: ./backend
        run: uv run black --check .

      - name: Import test
        working-directory: ./backend
        run: uv run python -c "from app.main import create_app; create_app()"

      - name: Run migrations
        working-directory: ./backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: ./backend
        # The whole tests/ tree runs, so new suites are picked up automatically —
        # Phase 4's inventory-deduction + HIL purchase-order suites, and Phase 5's
        # OCR pipeline (extraction, confidence, ocr_failed, the storage Wall), the
        # bill→stock HIL (no-commit-without-token, approve→increase, reject, Wall,
        # audit), and the RAG suites (vector store tenant-filter-before-similarity,
        # the embedding worker, OrderAgent search_knowledge_base). The LLM is mocked,
        # OCR + embeddings use the offline stubs, and the supplier webhook is
        # stubbed, so the suite stays offline; the live smoke test is deselected.
        run: uv run pytest tests -v

      - name: Golden ML evals (real artifacts)
        working-directory: ./backend
        # Phase 6 (Task 6.11): run the committed golden sets through the REAL trained
        # *.joblib and fail if any model regresses below its threshold
        # (app/ml/eval/thresholds.yaml). A model whose artifact is absent is skipped, not
        # failed. No DB/Vault needed — it loads artifacts + golden JSON straight from disk.
        run: uv run python -m app.ml.eval

      - name: Routing golden evals (offline mock)
        working-directory: ./backend
        # Phase 7 (Task 7.10): run the 26 Arabic routing queries through the offline
        # mock LLM (pre-programmed, deterministic, no network). Exits 1 if overall
        # accuracy < 0.85 or any per-class accuracy < 0.70.
        # Set ROUTING_EVAL_REAL_LLM=1 locally to test with the real Gemini LLM.
        run: uv run python -m app.agents.eval.evaluate_routing

      - name: Agent golden evals + red-team gate (offline mock)
        working-directory: ./backend
        # Phase 8 (Task 8.2): run 110 Lebanese Arabic queries (22 per agent × 5) through
        # the offline mock, and 28 injection/jailbreak probes through check_input().
        # Exits 1 if any agent's routing accuracy < 0.85 or red-team block rate < 0.92.
        # Set AGENT_EVAL_REAL_LLM=1 locally to test with the real Gemini LLM.
        run: uv run python -m app.agents.eval.evaluate_agents

      - name: Forbidden patterns check
        run: |
          # Scan only .py source (never compiled __pycache__ bytecode) and match
          # actual CALLS, not the words appearing in a comment or string literal.
          ! grep -rn --include="*.py" "os\.getenv(" backend/app/ \
            || (echo "Found os.getenv() outside Settings"; exit 1)
          ! grep -rEn --include="*.py" "(^|[^.[:alnum:]_])print\(" backend/app/ \
            || (echo "Found print() — use structlog"; exit 1)
          # Phase 4's supplier_dispatch.py POSTs the reorder webhook with
          # httpx.AsyncClient — this guard keeps it (and every other module) off
          # the banned requests library.
          ! grep -rn --include="*.py" "import requests" backend/app/ \
            || (echo "Found requests — use httpx.AsyncClient"; exit 1)

      - name: Provider-SDK boundary check
        run: |
          # Constitution: application code never imports a provider SDK directly.
          # The Google GenAI SDK is allowed ONLY inside app/agents/llm/ (the router
          # boundary). Anywhere else in app/ is a violation — the Phase 4
          # InventoryAgent reaches the model through the router's tier1(), and the
          # Phase 5 RAG embedder lives at app/agents/llm/gemini_embeddings.py (NOT
          # app/infra/), so both stay inside this boundary; the OCR engine's Vision
          # SDK is confined to app/infra/ocr/cloud_vision.py and checked by its own
          # unit test (test_ocr_engine), separate from this LLM-SDK gate.
          offenders=$(grep -rln --include="*.py" \
            "langchain_google_genai\|google.generativeai\|google.genai" backend/app/ \
            | grep -v "backend/app/agents/llm/") || true
          if [ -n "$offenders" ]; then
            echo "Provider SDK imported outside app/agents/llm/:"
            echo "$offenders"
            exit 1
          fi

      - name: No inline prompts in agents
        run: |
          # Prompts live in prompts/ files, never as inline string literals in
          # agent code (constitution). Flag triple-quoted blocks under app/agents/.
          offenders=$(grep -rln --include="*.py" '"""' backend/app/agents/ \
            | xargs -r grep -l 'إنت\|اكتب\|أنت مساعد\|You are' 2>/dev/null) || true
          if [ -n "$offenders" ]; then
            echo "Possible inline prompt text in agent code (move to prompts/):"
            echo "$offenders"
            exit 1
          fi

      - name: Tenant-scoping guard
        run: |
          # The Wall is enforced by the base repository. Guard against regressions:
          # 1) No raw SQL in the repository layer — everything goes through the
          #    tenant-scoped query builder, never a hand-written text() string.
          ! grep -rn "text(" backend/app/repositories/ \
            || (echo "Raw text() SQL in repositories bypasses tenant scoping"; exit 1)
          # 2) Every repository class must extend TenantScopedRepository, EXCEPT
          #    the documented "above-the-Wall" roots — identities/records that sit
          #    above the tenant boundary and therefore have no tenant_id to scope:
          #      - TenantRepository       (the tenant itself — the root)
          #      - AdminRepository        (the founder/super-admin, above all tenants)
          #      - SignupRequestRepository(a pending application, no tenant yet)
          #    These are intentionally not tenant-scoped (constitution I): they are
          #    never a path into tenant-owned data. Any OTHER repository must extend
          #    the tenant-scoped base.
          offenders=$(grep -rn "^class .*Repository" backend/app/repositories/ \
            | grep -v "TenantScopedRepository" \
            | grep -v "class TenantScopedRepository" \
            | grep -vE "class (TenantRepository|AdminRepository|SignupRequestRepository):") || true
          if [ -n "$offenders" ]; then
            echo "Repository not extending TenantScopedRepository (and not a documented above-the-Wall root):"
            echo "$offenders"
            exit 1
          fi

  # The OCR worker (Phase 5) runs the SAME image as the api, a different entrypoint
  # (python -m app.worker). Build that image to prove it still builds and that the
  # worker module imports cleanly inside it — the worker is part of the deployable
  # surface now, not just the api.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (api + worker share it)
        run: docker build -t modir-backend ./backend
      - name: Worker entrypoint imports in the image
        run: docker run --rm modir-backend python -c "import app.worker"

  # The dashboard is its own deployable; lint, typecheck, and build it
  # independently of the backend job. A type error or build failure fails CI.
  # Covers the Phase 5 additions — the bills list, the upload control, and the
  # bill-review screen — alongside the earlier Phase 3/4 pages.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, zero warnings)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite)
        run: npm run build
