[project]
name = "modir-backend"
version = "0.1.0"
description = "AI business operations assistant for Lebanese SMEs"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",        # Phase 1+ — vector similarity search
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "hvac>=2.3.0",
    "tenacity>=9.0.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.0",     # Phase 7 — Grok adapter (OpenAI-compatible; quarantined to grok_router.py)
    "langchain-anthropic>=0.3.0",  # Phase 7 — Claude adapter (emergency fallback; quarantined to anthropic_router.py)
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",  # Phase 7 — Postgres-backed conversation checkpoints
    "psycopg[binary]>=3.1.0",               # Phase 7 — psycopg3 binary wheel for the LangGraph checkpointer
    "psycopg-pool>=3.2.0",                  # Phase 7 — async connection pool for the checkpointer
    "langsmith>=0.1.0",
    "tzdata>=2026.2",
    "aiosmtplib>=5.1.1",
    "minio>=7.2.0",          # Phase 5 — supplier-bill image storage (MinIO/S3)
    "google-cloud-vision>=3.7.0",  # Phase 5 — OCR engine (Lebanese-Arabic bills)
    "pillow>=11.0.0",        # Phase 5 — bill image preprocessing (deskew/denoise/contrast)
    # Phase 6 — The ML Layer. ML predicts (Constitution IV), never an LLM prompt.
    # Pinned floors; trained pipelines live in app/ml/ and load once via lifespan.
    # numpy was already a transitive dep (app/infra/embeddings.py) — declared here
    # directly now that ML depends on it explicitly. prophet is intentionally NOT
    # added yet: Task 6.5 decides per the data whether the demand series warrant it,
    # and a heavy dep stays out of the image until it earns its place.
    "numpy>=2.1.0",          # Phase 6 — feature arrays, seasonal residuals
    "pandas>=2.2.0",         # Phase 6 — training frames, time-indexed history
    "scikit-learn>=1.5.0",   # Phase 6 — Pipeline, TimeSeriesSplit, CV, the baselines
    "xgboost>=2.1.0",        # Phase 6 — gradient-boosted candidate per task
    "joblib>=1.4.0",         # Phase 6 — persist/load trained pipelines (artifacts)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "integration: requires a running Postgres instance (skipped in offline CI)",
]
