[project]
name = "modir-backend"
version = "0.1.0"
description = "AI business operations assistant for Lebanese SMEs"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",        # Phase 1+ — vector similarity search
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "hvac>=2.3.0",
    "tenacity>=9.0.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.0",     # Phase 7 — Grok adapter (OpenAI-compatible; quarantined to grok_router.py)
    "langchain-anthropic>=0.3.0",  # Phase 7 — Claude adapter (emergency fallback; quarantined to anthropic_router.py)
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",  # Phase 7 — Postgres-backed conversation checkpoints
    "psycopg[binary]>=3.1.0",               # Phase 7 — psycopg3 binary wheel for the LangGraph checkpointer
    "psycopg-pool>=3.2.0",                  # Phase 7 — async connection pool for the checkpointer
    "langsmith>=0.1.0",
    "tzdata>=2026.2",
    "aiosmtplib>=5.1.1",
    "minio>=7.2.0",          # Phase 5 — supplier-bill image storage (MinIO/S3)
    "google-cloud-vision>=3.7.0",  # Phase 5 — OCR engine (Lebanese-Arabic bills)
    "opencv-python-headless>=4.10.0",  # Phase 5 — bill image preprocessing (grayscale/CLAHE/denoise/deskew); headless = no GUI/X11 deps
    "pillow>=11.0.0",        # Phase 5 — image decoding for OCR fixtures/tests and inline-media helpers
    # Phase 6 — The ML Layer. ML predicts (Constitution IV), never an LLM prompt.
    # Pinned floors; trained pipelines live in app/ml/ and load once via lifespan.
    # numpy was already a transitive dep (app/infra/embeddings.py) — declared here
    # directly now that ML depends on it explicitly. prophet is intentionally NOT
    # added yet: Task 6.5 decides per the data whether the demand series warrant it,
    # and a heavy dep stays out of the image until it earns its place.
    "numpy>=2.1.0",          # Phase 6 — feature arrays, seasonal residuals
    "pandas>=2.2.0",         # Phase 6 — training frames, time-indexed history
    "scikit-learn>=1.5.0",   # Phase 6 — Pipeline, TimeSeriesSplit, CV, the baselines
    "xgboost>=2.1.0",        # Phase 6 — gradient-boosted candidate per task
    "joblib>=1.4.0",         # Phase 6 — persist/load trained pipelines (artifacts)
    "redis>=5.0.0",          # Phase 8 — per-tenant rate limiting (token bucket in Redis)
]

[project.optional-dependencies]
# Phase 12 — Lebanese Arabic ASR (fine-tuned Whisper). QUARANTINED in an optional
# extra, NOT the main dependency list, ON PURPOSE (AD-12.6): torch + transformers add
# ~2 GB and must never land on the CI/dev path or in the runtime image. The default
# `uv sync --frozen` (CI) and `uv sync --frozen --no-dev` (Dockerfile) do NOT install
# extras, so this heavy stack stays off both. It is pulled deliberately only where it
# is needed — `uv sync --extra asr` for local serve/eval, and the Colab notebook's own
# pinned pip install for GPU fine-tuning (AD-12.1). These pins are the single source of
# truth the notebook mirrors. The serve backend (Task 12.4) and the train pipeline
# import this stack LAZILY, inside the whisper branch only.
asr = [
    "torch>=2.5.0",          # Whisper inference + Seq2SeqTrainer backprop (CPU serve / GPU train)
    "transformers>=4.46.0,<5.0",  # WhisperProcessor / WhisperForConditionalGeneration / Seq2SeqTrainer (4.x recipe)
    "datasets>=3.1.0",       # Common Voice `ar` load + 16 kHz cast (Task 12.2)
    "evaluate>=0.4.3",       # WER/CER metric harness (Task 12.3/12.6)
    "jiwer>=3.0.5",          # the WER/CER implementation evaluate delegates to
    "soundfile>=0.12.1",     # decode OGG/WAV bytes to arrays at serve time (Task 12.4)
    "accelerate>=1.1.0",     # Trainer device placement / mixed precision on the GPU
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "fakeredis>=2.20.0",           # Phase 8 — in-memory Redis for rate limiter tests
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "integration: requires a running Postgres instance (skipped in offline CI)",
    "load: load tests — require a running stack, excluded from normal CI (run with -m load)",
]
